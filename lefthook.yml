# The checks of this repository: the English one that it shares, on its
# Markdown, as Vale reads the other files here as plain text, with the code
# in them. This repository holds no Japanese, so it doesn't extend
# japanese.yml. The cases of tests/cases have findings on purpose.
extends:
  - english.yml

pre-commit:
  jobs:
    - name: english
      # The files that setup.sh puts hold prose in their comments, and the
      # checks leave them out where they lie in another repository.
      glob:
        - "*.md"
        - "files/*.yml"
      exclude:
        - "tests/cases/**"
