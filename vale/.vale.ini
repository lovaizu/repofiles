# The defaults of the English check. lib/lib.sh gives Vale this file as its
# user-level file, through XDG_CONFIG_HOME, so that Vale lays the .vale.ini
# of a repository over it. Vale finds the Google style in the directory of
# the tool vale-google, which lib/lib.sh gives Vale as VALE_STYLES_PATH.
# This StylesPath holds only the vocabulary Lovaizu.
StylesPath = styles
Vocab = Lovaizu
MinAlertLevel = suggestion

[*]
BasedOnStyles = Google
