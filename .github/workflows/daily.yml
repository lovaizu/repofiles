# The daily checks of files/.github/workflows/daily.yml, which says why
# they're a workflow apart, run on this repository by the action of the
# commit that it's on, as tests.yml runs it. So this repository finds a
# break of a daily check, and a dead link of its own files, before the
# repositories that setup.sh serves.
name: Daily

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# The checks only read the repository, so the token can change nothing.
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          daily: links
