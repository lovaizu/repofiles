# The Japanese check that a repository gets when its lefthook.yml names this
# repository in remotes, with japanese.yml in configs. A job runs in the root
# of that repository, and its script comes from .lefthook/ of this one.
# The job reads the staged Markdown files, the files that people read and
# the prompts, which the checks are for. A repository gives the job other
# files with glob and exclude of a job of the same name in its
# lefthook-repo.yml, or turns it off there with skip: true.
pre-commit:
  jobs:
    - name: japanese
      script: prose.sh
      runner: bash
      glob: "*.md"
      args: "japanese {staged_files}"
