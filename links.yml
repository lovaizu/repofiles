# The links check that a repository gets when its lefthook.yml names this
# repository in remotes, with links.yml in configs. A job runs in the root
# of that repository, and its script comes from .lefthook/ of this one.
# The job reads the staged Markdown files, as the checks of the languages
# do. A repository gives the job other files with glob and exclude of a job
# of the same name in its lefthook-repo.yml, or turns it off there with
# skip: true. Its lychee.toml changes what lychee checks.
pre-commit:
  jobs:
    - name: links
      script: prose.sh
      runner: bash
      glob: "*.md"
      args: "links {staged_files}"
